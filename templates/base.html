<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "VORTEX" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="ZARIAA is a secure medicine verification interface for registering encrypted QR codes and validating authenticity in seconds."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600;700;800&family=Syne:wght@500;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/landing.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a href="/" class="brand-mark">
            <span class="brand-lockup">
                <img src="/static/assets/vortex-logo.png" alt="VORTEX logo" class="brand-logo">
                <span class="brand-title">ZARIAA</span>
            </span>
            <span class="brand-subtitle">AI-assisted pharma trust layer</span>
        </a>

        <nav class="site-nav" aria-label="Primary">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
            <a href="/register" class="{% if request.path == '/register' %}active{% endif %}">Register</a>
            <a href="/scan" class="{% if request.path == '/scan' %}active{% endif %}">Scan</a>
            <a href="/map">Pharmacies</a>
            {% if is_authenticated %}
            <span class="user-chip">{{ current_user }}</span>
            <a href="/logout">Logout</a>
            {% else %}
            <a href="/login" class="{% if request.path == '/login' %}active{% endif %}">Login</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
